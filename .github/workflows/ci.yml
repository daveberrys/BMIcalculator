name: Build

on:
  push:
    paths:
      - 'src/**'
      - 'assets/**'
      - '**.toml'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            target: "x86_64-unknown-linux-gnu"
          - platform: windows-latest
            target: "x86_64-pc-windows-msvc"
          - platform: macos-latest
            target: "aarch64-apple-darwin"
          - platform: macos-latest
            target: "x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli

      - name: Install Dependencies for Ubuntu
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt update
          sudo apt install libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            lld

      - name: Compile for Linux
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: dx bundle --desktop --release --package-types "appimage" --package-types "rpm" --package-types "deb"

      - name: Compile for macOS Silicon
        if: matrix.target == 'aarch64-apple-darwin'
        run: dx bundle --desktop --release --package-types "macos" --package-types "dmg"

      - name: Compile for macOS Intel
        if: matrix.target == 'x86_64-apple-darwin'
        run: dx bundle --desktop --release --package-types "macos" --package-types "dmg"

      - name: Compile for Windows
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: dx bundle --desktop --release --package-types "msi" --package-types "nsis"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: solarlauncher-${{ matrix.platform }}-${{ matrix.target || 'native' }}
          path: |
            target/dx/bm-icalculator/bundle/*
          if-no-files-found: warn
